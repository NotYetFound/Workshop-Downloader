[package]
name = "workshop-downloader"
version = "0.4.1"
edition = "2024"
rust-version = "1.90"
description = "A desktop browser for Steam Workshop"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
flate2 = "1"
os_info = { version = "3", default-features = false }
portable-pty = "0.9.0"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tauri = { version = "2.12.5", features = ["unstable"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
ts-rs = "12.0.1"
unicode-normalization = "0.1"
url = "2"
zip = { version = "6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
landlock = "0.4.7"
rustix = { version = "1.1.6", features = ["fs", "process"] }
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
debug = 0
