name: Draft release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

env:
  WORKSHOP_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,rpm
            name: linux-x86_64
          - os: windows-2022
            bundles: nsis
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.WORKSHOP_RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev rpm patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: Select AppImage media plugins
        if: runner.os == 'Linux'
        run: |
          plugins="$RUNNER_TEMP/workshop-gstreamer"
          mkdir -p "$plugins"
          dpkg -L libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good |
            awk '/\/gstreamer-1\.0\/[^/]+\.so$/' |
            while IFS= read -r plugin; do ln -sf "$plugin" "$plugins/"; done
          test -e "$plugins/libgstapp.so"
          echo "GSTREAMER_PLUGINS_DIR=$plugins" >> "$GITHUB_ENV"
      - shell: bash
        run: |
          version="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          test "$WORKSHOP_RELEASE_TAG" = "v$version"
      - run: npm ci
      - name: Configure optional updater signing
        id: signing
        shell: bash
        env:
          WORKSHOP_UPDATER_PUBLIC_KEY: ${{ vars.WORKSHOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$WORKSHOP_UPDATER_PUBLIC_KEY" && -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'config=--config src-tauri/updater-build.json' >> "$GITHUB_OUTPUT"
            node -e 'require("node:fs").writeFileSync("src-tauri/updater-build.json", JSON.stringify({bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.WORKSHOP_UPDATER_PUBLIC_KEY}}}))'
          elif [[ -n "$WORKSHOP_UPDATER_PUBLIC_KEY" || -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Configure both the updater public key and signing secret, or leave both unset.' >&2
            exit 1
          fi
      - name: Build distribution bundles
        uses: tauri-apps/tauri-action@v1
        env:
          WORKSHOP_UPDATER_PUBLIC_KEY: ${{ vars.WORKSHOP_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles ${{ matrix.bundles }} ${{ steps.signing.outputs.config }} -- --locked
      - uses: actions/upload-artifact@v6
        with:
          name: workshop-downloader-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/nsis/*-setup.exe
            src-tauri/target/release/bundle/**/*.sig

  draft:
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.WORKSHOP_RELEASE_TAG }}
      - uses: actions/download-artifact@v7
        with:
          pattern: workshop-downloader-*
          path: release-input
      - name: Prepare draft assets
        env:
          WORKSHOP_UPDATER_PUBLIC_KEY: ${{ vars.WORKSHOP_UPDATER_PUBLIC_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          GITHUB_REF_NAME="$WORKSHOP_RELEASE_TAG" python3 .github/prepare_release.py release-input release-assets
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$WORKSHOP_RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$WORKSHOP_RELEASE_TAG" --json isDraft --jq .isDraft)" = true
            gh release upload "$WORKSHOP_RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$WORKSHOP_RELEASE_TAG" release-assets/* --verify-tag --draft \
              --title "Workshop Downloader $WORKSHOP_RELEASE_TAG" --notes-file docs/release-notes.md
          fi
